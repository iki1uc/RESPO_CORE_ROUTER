<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>UI‑SCANNER</title>
</head>

<body>
    <h1>UI‑SCANNER</h1>
    <p>Scannt UI‑Elemente und meldet sie an den CORE_ROUTER.</p>

    <button onclick="scanUI()">UI scannen</button>

    <script>
        function scanUI() {
            const elements = document.querySelectorAll('*');

            if (window.parent && window.parent.Router) {
                window.parent.Router.reportUI(elements.length);
            } else {
                console.log("Router nicht erreichbar.");
            }
        }
    </script>
</body>
</html>
